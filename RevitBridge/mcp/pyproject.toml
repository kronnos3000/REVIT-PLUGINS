[project]
name = "revit-bridge-mcp"
version = "1.3.0"
description = "MCP server for Autodesk Revit via the CCorp RevitBridge add-in (named pipe), hosted by Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Construction Corps" }]
keywords = ["mcp", "revit", "autodesk", "bim", "claude"]

dependencies = [
    # Pinned to the 1.x line: mcp 2.0 dropped `mcp.server.fastmcp`, which server.py uses.
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # Named-pipe transport to the RevitBridge add-in. Windows only (Revit is Windows only).
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8"]

[project.scripts]
# After `pip install -e .` you can launch the server simply as `revit-bridge-mcp`.
revit-bridge-mcp = "revit_bridge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revit_bridge_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
